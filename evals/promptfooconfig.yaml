# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Human writing distinction evals for tech-humanizer-skill

prompts:
  - file://humanize.txt

providers:
  - id: openai:chat:meta/llama-3.3-70b-instruct
    config:
      apiBaseUrl: https://integrate.api.nvidia.com/v1
      apiKeyEnvar: NVIDIA_API_KEY
      temperature: 0
      max_tokens: 1200

defaultTest:
  options:
    provider:
      id: openai:chat:meta/llama-3.3-70b-instruct
      config:
        apiBaseUrl: https://integrate.api.nvidia.com/v1
        apiKeyEnvar: NVIDIA_API_KEY
        temperature: 0
        max_tokens: 1200
  assert:
    - type: javascript
      metric: no_ceremonial_ai_markers
      value: |
        const forbidden = [
          /it is important to note/i,
          /in today's (?:fast-paced|digital|ever-evolving)/i,
          /delve/i,
          /unlock/i,
          /empower/i,
          /seamless/i,
          /comprehensive/i,
          /plethora/i
        ];
        return forbidden.every((pattern) => !pattern.test(output));
    - type: javascript
      metric: no_format_leakage
      value: |
        return !/^(Here(?:'s| is)|Certainly|Sure|Of course)[,.!:\s]/i.test(output.trim()) &&
        !/Changes:\s*$/i.test(output.trim()) &&
        !/```/.test(output);

tests: file://examples.yaml
